<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Show Tracker</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Clean Unified Top Navbar -->
    <header class="app-navbar">
      <div class="navbar-left">
        <div class="logo">
          <span class="icon">📺</span>
          <h1>TV Tracker</h1>
        </div>
      </div>

      <div class="navbar-center">
        <nav id="app-tabs" class="app-tabs">
          <button class="tab-btn active" data-tab="schedule">Schedule</button>
          <button class="tab-btn" data-tab="current">Current</button>
          <button class="tab-btn" data-tab="hiatus">Hiatus</button>
          <button class="tab-btn" data-tab="cancelled">Archive</button>
        </nav>
      </div>

      <div class="navbar-right">
        <button id="add-show-nav-btn" class="add-show-nav-btn" title="Add New TV Show">
          <span class="plus-icon">+</span> Add Show
        </button>
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Filter shows...">
        </div>
        <button id="admin-toggle-btn" class="settings-icon-btn" title="Sync Settings">⚙️</button>
        <button id="mobile-menu-btn" class="icon-btn mobile-only" title="Menu">☰</button>
      </div>
    </header>

    <!-- Context Sub-Toolbar -->
    <div class="sub-toolbar" id="sub-toolbar">
      <!-- Schedule Mode: Date Navigation (Left) & Scope Switcher (Right) -->
      <div class="schedule-controls" id="schedule-controls">
        <div class="date-nav" id="schedule-date-nav">
          <button id="schedule-prev-btn" class="nav-btn" title="Previous Range">‹</button>
          <button id="schedule-today-btn" class="nav-btn today-btn" title="Current Range">Today</button>
          <button id="schedule-next-btn" class="nav-btn" title="Next Range">›</button>
          <span id="schedule-range-label" class="range-label">This Week</span>
        </div>
        <div class="scope-switcher" id="scope-switcher">
          <button class="scope-btn active" data-scope="1week">1 Week</button>
          <button class="scope-btn" data-scope="2week">2 Weeks</button>
          <button class="scope-btn" data-scope="month">Month</button>
        </div>
      </div>

      <!-- Grid Mode: Category Count (Left) & Sort Dropdown (Right) -->
      <div class="category-info hidden" id="category-info">
        <span id="category-title" class="category-title">Current</span>
        <span id="category-count" class="category-count">0 shows</span>
      </div>

      <div class="sort-container hidden" id="sort-container">
        <span class="sort-icon">⇅</span>
        <select id="sort-select">
          <option value="alpha">Alphabetical</option>
          <option value="date">Next Air Date</option>
          <option value="popularity">Popularity</option>
        </select>
      </div>
    </div>

    <!-- Add Show Modal -->
    <div id="add-show-modal" class="modal hidden">
      <div class="modal-content modal-search-content">
        <div class="modal-header">
          <div class="modal-title-lock">
            <span class="icon">✨</span>
            <h2>Add TV Show</h2>
          </div>
          <button id="add-show-close-btn" class="close-icon-btn">×</button>
        </div>

        <div class="add-show-body">
          <div class="add-show-search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="add-show-input" placeholder="Search show title (e.g. Severance, Fallout)..." autocomplete="off">
            <button id="add-show-clear-btn" class="search-clear-btn hidden" title="Clear">✕</button>
          </div>

          <div id="add-show-status" class="add-show-status hidden">
            <div class="spinner-small"></div>
            <span>Searching TMDB...</span>
          </div>

          <div id="add-show-results" class="add-show-results">
            <div class="add-show-placeholder">
              <span class="placeholder-icon">📺</span>
              <p>Type a show title above to search TMDB</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Admin Modal -->
    <div id="admin-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title-lock">
            <span class="lock-icon">🔒</span>
            <h2>Admin Panel</h2>
          </div>
          <button id="admin-close-btn" class="close-icon-btn">×</button>
        </div>

        <!-- Logged Out State -->
        <div id="admin-logged-out" class="admin-state-view">
          <div class="admin-auth-actions">
            <button id="google-signin-btn" class="google-signin-btn">
              <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Sign in with Google</span>
            </button>
            <div id="auth-status-msg" class="auth-status-msg hidden"></div>
          </div>
        </div>

        <!-- Logged In State -->
        <div id="admin-logged-in" class="admin-state-view hidden">
          <div class="admin-user-bar">
            <img id="admin-user-photo" class="admin-avatar" src="" alt="Admin">
            <div class="admin-user-details">
              <div class="admin-name-row">
                <span id="admin-user-name" class="admin-user-name">Admin</span>
                <span class="verified-badge">✓ Verified</span>
              </div>
              <span id="admin-user-email" class="admin-user-email">email@example.com</span>
            </div>
            <button id="admin-signout-btn" class="signout-btn" title="Sign Out">Sign Out</button>
          </div>

          <div class="admin-actions-section">
            <div class="admin-actions">
              <button id="sync-btn" class="sync-btn full-width">
                <span class="sync-icon">⟳</span> Sync & Organize Spreadsheet
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <main id="calendar-container">
      <div id="loading" class="loading-state">
        <div class="spinner"></div>
        <p>Syncing schedule...</p>
      </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>
    
    <footer>
      <p>Synced with Brian's Theater Cloud | TV Show Tracker v1.6.0</p>
    </footer>
  </div>

  <script src="main.js?v=1.6.0" type="module"></script>
</body>
</html>
